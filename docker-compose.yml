services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: isolation
      POSTGRES_PASSWORD: isolation
      POSTGRES_DB: isolation_demo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isolation -d isolation_demo"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://isolation:isolation@db:5432/isolation_demo
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
